name: Add monthly events
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-monthly-events.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link monthly event files
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'monthly-events.css' not in s:
              s=s.replace('</head>','<link rel="stylesheet" href="monthly-events.css?v=1"></head>')
          if 'monthly-events.js' not in s:
              s=s.replace('</body>','<script src="monthly-events.js?v=1"></script></body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Show monthly events and today feature"
          git push
