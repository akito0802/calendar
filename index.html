<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>予定カレンダー</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #5b6cf9;
      --primary-soft: #eef0ff;
      --danger: #ef4444;
      --sat: #2563eb;
      --sun: #ef4444;
      --shadow: 0 14px 38px rgba(31, 41, 55, .10);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
        "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
    }

    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }

    .app {
      width: min(100%, 1100px);
      margin: 0 auto;
      padding: 14px 12px 90px;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .title-wrap { flex: 1; min-width: 0; }
    .title {
      margin: 0;
      font-size: clamp(22px, 5vw, 32px);
      font-weight: 800;
      letter-spacing: -.02em;
    }
    .subtitle {
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 10px;
      box-shadow: var(--shadow);
      margin-bottom: 12px;
    }

    .toolbar .month {
      flex: 1;
      text-align: center;
      font-size: clamp(18px, 4.8vw, 25px);
      font-weight: 800;
      white-space: nowrap;
    }

    .icon-btn, .today-btn, .add-btn {
      border: 0;
      border-radius: 12px;
      min-height: 42px;
      padding: 0 14px;
      font-weight: 700;
      background: var(--primary-soft);
      color: var(--primary);
    }

    .icon-btn { width: 44px; padding: 0; font-size: 22px; }
    .today-btn { background: #f3f4f6; color: var(--text); }
    .add-btn { background: var(--primary); color: white; }

    .calendar-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .weekdays, .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .weekday {
      text-align: center;
      padding: 10px 2px;
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
    }
    .weekday:first-child { color: var(--sun); }
    .weekday:last-child { color: var(--sat); }

    .day {
      position: relative;
      min-height: 112px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 7px 5px 5px;
      background: white;
      overflow: hidden;
    }
    .day:nth-child(7n) { border-right: 0; }
    .day.other-month { background: #fafafa; color: #b8bec8; }
    .day.today { background: #fffdf4; }
    .day.selected { outline: 2px solid var(--primary); outline-offset: -2px; z-index: 1; }

    .day-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
    }
    .day.today .day-number { background: var(--primary); color: white; }
    .day:nth-child(7n+1):not(.other-month) .day-number { color: var(--sun); }
    .day:nth-child(7n):not(.other-month) .day-number { color: var(--sat); }
    .day.today .day-number { color: white !important; }

    .events {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-top: 3px;
    }

    .event-chip {
      width: 100%;
      border: 0;
      border-left: 4px solid var(--event-color);
      border-radius: 6px;
      padding: 4px 5px;
      text-align: left;
      background: color-mix(in srgb, var(--event-color) 12%, white);
      color: #273043;
      font-size: 11px;
      line-height: 1.25;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .event-chip.done { opacity: .55; text-decoration: line-through; }

    .more {
      font-size: 10px;
      color: var(--muted);
      padding-left: 4px;
    }

    .agenda {
      margin-top: 14px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      box-shadow: var(--shadow);
    }

    .agenda-title {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }
    .agenda-title h2 { margin: 0; font-size: 17px; }
    .agenda-title span { color: var(--muted); font-size: 12px; }

    .agenda-empty {
      padding: 18px 5px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }

    .agenda-item {
      display: grid;
      grid-template-columns: 8px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px 0;
      border-top: 1px solid var(--line);
    }
    .agenda-item:first-child { border-top: 0; }
    .color-bar { width: 8px; height: 44px; border-radius: 99px; background: var(--event-color); }
    .agenda-main { min-width: 0; }
    .agenda-name { font-weight: 800; overflow-wrap: anywhere; }
    .agenda-meta { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .agenda-actions { display: flex; gap: 5px; }
    .small-btn {
      border: 0;
      border-radius: 9px;
      padding: 7px 9px;
      background: #f3f4f6;
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
    }
    .small-btn.danger { color: var(--danger); background: #fff1f2; }

    .fab {
      position: fixed;
      right: 20px;
      bottom: calc(20px + env(safe-area-inset-bottom));
      width: 58px;
      height: 58px;
      border: 0;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      font-size: 31px;
      line-height: 1;
      box-shadow: 0 12px 28px rgba(91, 108, 249, .38);
      z-index: 20;
    }

    dialog {
      width: min(calc(100% - 24px), 500px);
      border: 0;
      border-radius: 22px;
      padding: 0;
      box-shadow: 0 24px 80px rgba(0,0,0,.25);
    }
    dialog::backdrop { background: rgba(15, 23, 42, .52); backdrop-filter: blur(3px); }

    .modal { padding: 20px; }
    .modal h2 { margin: 0 0 16px; font-size: 21px; }
    .field { margin-bottom: 13px; }
    .field label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 800; }
    .field input, .field textarea, .field select {
      width: 100%;
      border: 1px solid #d6dae2;
      border-radius: 11px;
      padding: 11px 12px;
      background: white;
      color: var(--text);
    }
    .field textarea { resize: vertical; min-height: 76px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .colors { display: flex; gap: 9px; flex-wrap: wrap; }
    .color-choice input { position: absolute; opacity: 0; pointer-events: none; }
    .color-dot {
      display: block;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--choice);
      border: 3px solid white;
      box-shadow: 0 0 0 1px #d1d5db;
    }
    .color-choice input:checked + .color-dot { box-shadow: 0 0 0 3px var(--choice); }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }
    .modal-actions button {
      border: 0;
      border-radius: 11px;
      min-height: 42px;
      padding: 0 16px;
      font-weight: 800;
    }
    .cancel { background: #f3f4f6; }
    .save { background: var(--primary); color: white; }

    @media (max-width: 680px) {
      .app { padding-inline: 8px; }
      .topbar { padding: 4px 4px 0; }
      .subtitle { display: none; }
      .toolbar { padding: 7px; border-radius: 15px; }
      .today-btn { display: none; }
      .add-btn { display: none; }
      .day { min-height: 82px; padding: 4px 2px 3px; }
      .day-number { width: 24px; height: 24px; font-size: 12px; }
      .event-chip { padding: 3px 3px; font-size: 9px; border-left-width: 3px; }
      .more { font-size: 9px; }
      .agenda { border-radius: 15px; padding: 12px; }
    }

    @media (max-width: 390px) {
      .day { min-height: 72px; }
      .event-chip { font-size: 8px; }
    }

    /* Theme switcher */
    body, .toolbar, .calendar-card, .agenda, .day, dialog, .field input, .field textarea, .field select {
      transition: background-color .28s ease, color .28s ease, border-color .28s ease, box-shadow .28s ease;
    }
    .theme-picker {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .theme-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }
    .theme-btn {
      border: 1px solid var(--line);
      border-radius: 999px;
      min-height: 36px;
      padding: 0 11px;
      background: var(--card);
      color: var(--text);
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 5px 15px rgba(31,41,55,.07);
    }
    .theme-btn.active {
      color: #fff;
      background: var(--primary);
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    body[data-theme="wood"] {
      --bg: #e8d3b0;
      --card: #fff8ec;
      --text: #4a2f1d;
      --muted: #86684f;
      --line: #c7a77d;
      --primary: #8b5a2b;
      --primary-soft: #ead5b8;
      --danger: #b33b31;
      --shadow: 0 14px 38px rgba(78,45,19,.18);
      background:
        repeating-linear-gradient(92deg, rgba(110,70,35,.08) 0 2px, transparent 2px 15px),
        repeating-linear-gradient(88deg, transparent 0 26px, rgba(95,57,28,.07) 27px 29px),
        linear-gradient(135deg,#d8b98b,#f0dfbf 48%,#cfa774);
    }
    body[data-theme="wood"] .calendar-card,
    body[data-theme="wood"] .toolbar,
    body[data-theme="wood"] .agenda,
    body[data-theme="wood"] dialog {
      background:
        linear-gradient(rgba(255,249,238,.94),rgba(255,249,238,.94)),
        repeating-linear-gradient(90deg,#8d5f35 0 2px,#bd8b59 2px 14px);
    }
    body[data-theme="wood"] .day { background: rgba(255,250,241,.82); }
    body[data-theme="wood"] .day.other-month { background: rgba(227,205,174,.48); }

    body[data-theme="space"] {
      --bg: #060b20;
      --card: #101936;
      --text: #f4f7ff;
      --muted: #a9b3d1;
      --line: #29345e;
      --primary: #8b5cf6;
      --primary-soft: #25224a;
      --danger: #fb7185;
      --shadow: 0 16px 42px rgba(0,0,0,.42);
      background:
        radial-gradient(circle at 18% 22%, rgba(255,255,255,.9) 0 1px, transparent 1.5px),
        radial-gradient(circle at 77% 18%, rgba(164,194,255,.8) 0 1px, transparent 1.5px),
        radial-gradient(circle at 67% 74%, rgba(255,255,255,.75) 0 1.2px, transparent 1.7px),
        radial-gradient(circle at 30% 80%, rgba(210,177,255,.8) 0 1px, transparent 1.5px),
        radial-gradient(ellipse at top, #202b62 0,#0c1230 42%,#050817 100%);
      background-size: 90px 90px,130px 130px,160px 160px,110px 110px,auto;
    }
    body[data-theme="space"] .toolbar,
    body[data-theme="space"] .calendar-card,
    body[data-theme="space"] .agenda,
    body[data-theme="space"] dialog { background: rgba(13,22,53,.88); backdrop-filter: blur(13px); }
    body[data-theme="space"] .day { background: rgba(16,25,54,.8); }
    body[data-theme="space"] .day.other-month { background: rgba(7,12,30,.72); color:#667096; }
    body[data-theme="space"] .day.today { background: rgba(96,63,180,.30); }
    body[data-theme="space"] .event-chip { color:#f8faff; background:rgba(255,255,255,.09); }
    body[data-theme="space"] .small-btn,
    body[data-theme="space"] .today-btn,
    body[data-theme="space"] .cancel { background:#202a4d; color:#eef2ff; }
    body[data-theme="space"] .field input,
    body[data-theme="space"] .field textarea,
    body[data-theme="space"] .field select { background:#0d1734; color:#fff; border-color:#33406c; }

    body[data-theme="arabian"] {
      --bg: #1c1230;
      --card: #fff3d8;
      --text: #382044;
      --muted: #765a75;
      --line: #d7b55b;
      --primary: #8f2d7d;
      --primary-soft: #f2d6e9;
      --danger: #b91c1c;
      --shadow: 0 15px 40px rgba(39,16,52,.24);
      background:
        radial-gradient(circle at 50% -5%,#5d2678 0 22%,transparent 45%),
        repeating-linear-gradient(45deg,rgba(225,187,77,.10) 0 8px,transparent 8px 20px),
        linear-gradient(160deg,#140d25,#392052 55%,#171027);
    }
    body[data-theme="arabian"] .calendar-card,
    body[data-theme="arabian"] .toolbar,
    body[data-theme="arabian"] .agenda,
    body[data-theme="arabian"] dialog {
      background:
        linear-gradient(rgba(255,246,222,.95),rgba(255,246,222,.95)),
        repeating-linear-gradient(45deg,#d7b55b 0 2px,transparent 2px 16px);
      border-width:2px;
    }
    body[data-theme="arabian"] .title::before { content:"☾ "; color:#f0c75e; text-shadow:0 0 12px #f0c75e; }
    body[data-theme="arabian"] .title::after { content:" ✦"; color:#f0c75e; }
    body[data-theme="arabian"] .day { background:rgba(255,249,234,.86); }
    body[data-theme="arabian"] .day.other-month { background:rgba(229,211,184,.58); }
    body[data-theme="arabian"] .day.today { background:#ffe7a5; }

    body[data-theme="sea"] {
      --bg: #dff6fb;
      --card: #f8feff;
      --text: #123b4a;
      --muted: #527d89;
      --line: #a9dbe5;
      --primary: #008fb3;
      --primary-soft: #d6f4f8;
      --danger: #e05b65;
      --shadow: 0 15px 38px rgba(0,111,139,.16);
      background:
        radial-gradient(circle at 10% 18%,rgba(255,255,255,.75) 0 6px,transparent 7px),
        radial-gradient(circle at 82% 30%,rgba(255,255,255,.65) 0 4px,transparent 5px),
        repeating-radial-gradient(ellipse at 50% 110%,rgba(255,255,255,.3) 0 12px,transparent 13px 27px),
        linear-gradient(#8ed7e8 0,#c8f1f5 38%,#eafcff 100%);
      background-size:120px 120px,160px 160px,150px 58px,auto;
    }
    body[data-theme="sea"] .calendar-card,
    body[data-theme="sea"] .toolbar,
    body[data-theme="sea"] .agenda,
    body[data-theme="sea"] dialog { background:rgba(248,254,255,.91); backdrop-filter:blur(9px); }
    body[data-theme="sea"] .day { background:rgba(250,255,255,.77); }
    body[data-theme="sea"] .day.other-month { background:rgba(191,232,238,.42); }
    body[data-theme="sea"] .day.today { background:#d6f8ee; }
    body[data-theme="sea"] .title::before { content:"🌊 "; }

    @media (max-width: 760px) {
      .topbar { align-items:flex-start; }
      .theme-picker { max-width:210px; gap:5px; }
      .theme-label { width:100%; text-align:right; }
      .theme-btn { min-height:31px; padding:0 8px; font-size:10px; }
    }
    @media (max-width: 470px) {
      .topbar { display:block; }
      .theme-picker { margin-top:10px; max-width:none; justify-content:flex-start; }
      .theme-label { width:auto; text-align:left; }
    }

  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="title-wrap">
        <h1 class="title">予定カレンダー</h1>
        <div class="subtitle">予定はこの端末のブラウザに保存されるよ</div>
      </div>
      <div class="theme-picker" id="themePicker" aria-label="デザイン切り替え">
        <span class="theme-label">デザイン</span>
        <button type="button" class="theme-btn" data-theme="simple">シンプル</button>
        <button type="button" class="theme-btn" data-theme="wood">木目</button>
        <button type="button" class="theme-btn" data-theme="space">宇宙</button>
        <button type="button" class="theme-btn" data-theme="arabian">アラビアン</button>
        <button type="button" class="theme-btn" data-theme="sea">海</button>
      </div>
      <button class="add-btn" id="headerAdd">＋ 予定を追加</button>
    </header>

    <section class="toolbar">
      <button class="icon-btn" id="prevMonth" aria-label="前の月">‹</button>
      <button class="today-btn" id="todayBtn">今日</button>
      <div class="month" id="monthLabel"></div>
      <button class="icon-btn" id="nextMonth" aria-label="次の月">›</button>
    </section>

    <section class="calendar-card">
      <div class="weekdays">
        <div class="weekday">日</div><div class="weekday">月</div><div class="weekday">火</div>
        <div class="weekday">水</div><div class="weekday">木</div><div class="weekday">金</div>
        <div class="weekday">土</div>
      </div>
      <div class="calendar" id="calendar"></div>
    </section>

    <section class="agenda">
      <div class="agenda-title">
        <h2 id="agendaHeading">選択日の予定</h2>
        <span>日付をタップして追加</span>
      </div>
      <div id="agendaList"></div>
    </section>
  </main>

  <button class="fab" id="fab" aria-label="予定を追加">＋</button>

  <dialog id="eventDialog">
    <form class="modal" id="eventForm">
      <h2 id="dialogTitle">予定を追加</h2>
      <input type="hidden" id="eventId" />

      <div class="field">
        <label for="eventTitle">予定名</label>
        <input id="eventTitle" maxlength="80" required placeholder="例：レポート提出" />
      </div>

      <div class="row">
        <div class="field">
          <label for="eventDate">日付</label>
          <input id="eventDate" type="date" required />
        </div>
        <div class="field">
          <label for="eventTime">時間</label>
          <input id="eventTime" type="time" />
        </div>
      </div>

      <div class="field">
        <label for="eventCategory">カテゴリー</label>
        <select id="eventCategory">
          <option>予定</option>
          <option>大学</option>
          <option>課題</option>
          <option>仕事</option>
          <option>プライベート</option>
          <option>その他</option>
        </select>
      </div>

      <div class="field">
        <label>色</label>
        <div class="colors" id="colorChoices"></div>
      </div>

      <div class="field">
        <label for="eventMemo">メモ</label>
        <textarea id="eventMemo" maxlength="500" placeholder="場所や持ち物など"></textarea>
      </div>

      <div class="modal-actions">
        <button type="button" class="cancel" id="cancelDialog">キャンセル</button>
        <button type="submit" class="save">保存</button>
      </div>
    </form>
  </dialog>

  <script>
    const STORAGE_KEY = "simple-calendar-events-v1";
    const COLORS = ["#5b6cf9", "#ec4899", "#10b981", "#f59e0b", "#8b5cf6", "#ef4444", "#06b6d4"];

    const calendarEl = document.getElementById("calendar");
    const monthLabel = document.getElementById("monthLabel");
    const agendaHeading = document.getElementById("agendaHeading");
    const agendaList = document.getElementById("agendaList");
    const dialog = document.getElementById("eventDialog");
    const form = document.getElementById("eventForm");

    let events = loadEvents();
    let viewDate = new Date();
    viewDate.setDate(1);
    let selectedDate = formatDate(new Date());

    function loadEvents() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(data) ? data : [];
      } catch {
        return [];
      }
    }

    function saveEvents() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
    }

    function formatDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function parseDate(value) {
      const [y, m, d] = value.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function dateLabel(value) {
      const date = parseDate(value);
      return `${date.getMonth() + 1}月${date.getDate()}日（${"日月火水木金土"[date.getDay()]}）`;
    }

    function render() {
      monthLabel.textContent = `${viewDate.getFullYear()}年 ${viewDate.getMonth() + 1}月`;
      calendarEl.innerHTML = "";

      const year = viewDate.getFullYear();
      const month = viewDate.getMonth();
      const first = new Date(year, month, 1);
      const start = new Date(year, month, 1 - first.getDay());
      const today = formatDate(new Date());

      for (let i = 0; i < 42; i++) {
        const date = new Date(start);
        date.setDate(start.getDate() + i);
        const dateKey = formatDate(date);
        const dayEvents = events
          .filter(e => e.date === dateKey)
          .sort((a, b) => (a.time || "99:99").localeCompare(b.time || "99:99"));

        const day = document.createElement("div");
        day.className = "day";
        if (date.getMonth() !== month) day.classList.add("other-month");
        if (dateKey === today) day.classList.add("today");
        if (dateKey === selectedDate) day.classList.add("selected");
        day.dataset.date = dateKey;

        const number = document.createElement("span");
        number.className = "day-number";
        number.textContent = date.getDate();
        day.appendChild(number);

        const list = document.createElement("div");
        list.className = "events";

        dayEvents.slice(0, 3).forEach(event => {
          const chip = document.createElement("button");
          chip.type = "button";
          chip.className = "event-chip" + (event.done ? " done" : "");
          chip.style.setProperty("--event-color", event.color);
          chip.textContent = `${event.time ? event.time + " " : ""}${event.title}`;
          chip.addEventListener("click", ev => {
            ev.stopPropagation();
            openDialog(event);
          });
          list.appendChild(chip);
        });

        if (dayEvents.length > 3) {
          const more = document.createElement("div");
          more.className = "more";
          more.textContent = `ほか${dayEvents.length - 3}件`;
          list.appendChild(more);
        }

        day.appendChild(list);
        day.addEventListener("click", () => {
          selectedDate = dateKey;
          if (date.getMonth() !== viewDate.getMonth()) {
            viewDate = new Date(date.getFullYear(), date.getMonth(), 1);
          }
          render();
          openDialog(null, dateKey);
        });
        calendarEl.appendChild(day);
      }

      renderAgenda();
    }

    function renderAgenda() {
      agendaHeading.textContent = `${dateLabel(selectedDate)}の予定`;
      const dayEvents = events
        .filter(e => e.date === selectedDate)
        .sort((a, b) => (a.time || "99:99").localeCompare(b.time || "99:99"));

      if (!dayEvents.length) {
        agendaList.innerHTML = '<div class="agenda-empty">予定はまだないよ</div>';
        return;
      }

      agendaList.innerHTML = "";
      dayEvents.forEach(event => {
        const item = document.createElement("div");
        item.className = "agenda-item";
        item.style.setProperty("--event-color", event.color);

        const bar = document.createElement("div");
        bar.className = "color-bar";

        const main = document.createElement("div");
        main.className = "agenda-main";
        main.innerHTML = `
          <div class="agenda-name" style="${event.done ? "text-decoration:line-through;opacity:.55" : ""}">
            ${escapeHtml(event.title)}
          </div>
          <div class="agenda-meta">
            ${event.time ? escapeHtml(event.time) + "・" : ""}${escapeHtml(event.category || "予定")}
            ${event.memo ? "・" + escapeHtml(event.memo) : ""}
          </div>`;

        const actions = document.createElement("div");
        actions.className = "agenda-actions";

        const done = document.createElement("button");
        done.className = "small-btn";
        done.textContent = event.done ? "戻す" : "完了";
        done.addEventListener("click", () => {
          event.done = !event.done;
          saveEvents();
          render();
        });

        const edit = document.createElement("button");
        edit.className = "small-btn";
        edit.textContent = "編集";
        edit.addEventListener("click", () => openDialog(event));

        const del = document.createElement("button");
        del.className = "small-btn danger";
        del.textContent = "削除";
        del.addEventListener("click", () => {
          if (confirm(`「${event.title}」を削除する？`)) {
            events = events.filter(e => e.id !== event.id);
            saveEvents();
            render();
          }
        });

        actions.append(done, edit, del);
        item.append(bar, main, actions);
        agendaList.appendChild(item);
      });
    }

    function openDialog(event = null, date = selectedDate) {
      document.getElementById("dialogTitle").textContent = event ? "予定を編集" : "予定を追加";
      document.getElementById("eventId").value = event?.id || "";
      document.getElementById("eventTitle").value = event?.title || "";
      document.getElementById("eventDate").value = event?.date || date;
      document.getElementById("eventTime").value = event?.time || "";
      document.getElementById("eventCategory").value = event?.category || "予定";
      document.getElementById("eventMemo").value = event?.memo || "";
      buildColorChoices(event?.color || COLORS[0]);
      dialog.showModal();
      setTimeout(() => document.getElementById("eventTitle").focus(), 50);
    }

    function buildColorChoices(selected) {
      const wrap = document.getElementById("colorChoices");
      wrap.innerHTML = "";
      COLORS.forEach((color, i) => {
        const label = document.createElement("label");
        label.className = "color-choice";
        label.style.setProperty("--choice", color);
        label.innerHTML = `
          <input type="radio" name="eventColor" value="${color}" ${color === selected ? "checked" : ""}>
          <span class="color-dot"></span>`;
        wrap.appendChild(label);
      });
    }

    form.addEventListener("submit", e => {
      e.preventDefault();
      const id = document.getElementById("eventId").value;
      const entry = {
        id: id || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())),
        title: document.getElementById("eventTitle").value.trim(),
        date: document.getElementById("eventDate").value,
        time: document.getElementById("eventTime").value,
        category: document.getElementById("eventCategory").value,
        memo: document.getElementById("eventMemo").value.trim(),
        color: document.querySelector('input[name="eventColor"]:checked')?.value || COLORS[0],
        done: id ? (events.find(e => e.id === id)?.done || false) : false
      };

      if (id) {
        events = events.map(e => e.id === id ? entry : e);
      } else {
        events.push(entry);
      }

      selectedDate = entry.date;
      const d = parseDate(entry.date);
      viewDate = new Date(d.getFullYear(), d.getMonth(), 1);
      saveEvents();
      dialog.close();
      render();
    });

    document.getElementById("cancelDialog").addEventListener("click", () => dialog.close());
    dialog.addEventListener("click", e => {
      const rect = dialog.getBoundingClientRect();
      if (e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom) {
        dialog.close();
      }
    });

    document.getElementById("prevMonth").addEventListener("click", () => {
      viewDate.setMonth(viewDate.getMonth() - 1);
      render();
    });
    document.getElementById("nextMonth").addEventListener("click", () => {
      viewDate.setMonth(viewDate.getMonth() + 1);
      render();
    });
    document.getElementById("todayBtn").addEventListener("click", goToday);
    document.getElementById("headerAdd").addEventListener("click", () => openDialog(null, selectedDate));
    document.getElementById("fab").addEventListener("click", () => openDialog(null, selectedDate));

    function goToday() {
      const now = new Date();
      selectedDate = formatDate(now);
      viewDate = new Date(now.getFullYear(), now.getMonth(), 1);
      render();
    }

    function escapeHtml(value = "") {
      return value.replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[c]));
    }

    const THEME_KEY = "calendar-theme-v1";
    function applyTheme(theme) {
      const valid = ["simple", "wood", "space", "arabian", "sea"];
      const selected = valid.includes(theme) ? theme : "simple";
      if (selected === "simple") {
        document.body.removeAttribute("data-theme");
      } else {
        document.body.dataset.theme = selected;
      }
      document.querySelectorAll(".theme-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.theme === selected);
      });
      localStorage.setItem(THEME_KEY, selected);
    }
    document.querySelectorAll(".theme-btn").forEach(btn => {
      btn.addEventListener("click", () => applyTheme(btn.dataset.theme));
    });
    applyTheme(localStorage.getItem(THEME_KEY) || "simple");

    render();
  </script>
</body>
</html>
