<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#596af6"><title>予定カレンダー</title><style>:root{--bg:#f5f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--p:#596af6;--soft:#eef0ff;--day:#fff;--other:#fafafa;--shadow:0 14px 38px #1f29371a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;transition:.3s}button,input,textarea,select{font:inherit}.app{max-width:1050px;margin:auto;padding:12px 8px 90px}.head{display:flex;align-items:center;gap:10px;margin-bottom:10px}.head h1{margin:0;flex:1;font-size:clamp(24px,5vw,34px)}.themes{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.theme{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:8px 10px;font-weight:800;font-size:12px}.theme.on{background:var(--p);color:#fff;border-color:var(--p)}.bar,.card,.agenda{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.bar{display:flex;align-items:center;gap:8px;padding:8px;margin-bottom:10px}.bar b{flex:1;text-align:center;font-size:22px}.bar button,.fab,.save{border:0;background:var(--p);color:white;font-weight:800}.bar button{width:44px;height:42px;border-radius:12px;font-size:22px}.week,.cal{display:grid;grid-template-columns:repeat(7,1fr)}.week div{text-align:center;padding:10px 0;font-size:12px;font-weight:800;border-bottom:1px solid var(--line);color:var(--muted)}.week div:first-child{color:#ef4444}.week div:last-child{color:#2563eb}.day{min-height:100px;padding:5px 3px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--day);overflow:hidden}.day:nth-child(7n){border-right:0}.other{background:var(--other);color:#9ca3af}.today{background:#fffbea}.sel{outline:2px solid var(--p);outline-offset:-2px}.num{display:flex;width:26px;height:26px;border-radius:50%;align-items:center;justify-content:center;font-size:12px;font-weight:800}.today .num{background:var(--p);color:#fff}.chip{display:block;width:100%;margin-top:3px;padding:3px 4px;border:0;border-left:4px solid var(--c);border-radius:6px;background:#f4f5ff;text-align:left;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.done{text-decoration:line-through;opacity:.5}.agenda{margin-top:12px;padding:14px}.agenda h2{margin:0 0 8px;font-size:17px}.empty{text-align:center;color:var(--muted);padding:18px}.item{display:grid;grid-template-columns:7px 1fr auto;gap:9px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}.line{width:7px;height:43px;border-radius:9px;background:var(--c)}.meta{font-size:12px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:4px}.actions button{border:0;border-radius:8px;padding:7px;background:var(--soft);color:var(--text);font-size:11px;font-weight:700}.actions .del{color:#e11d48;background:#fff1f2}.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;font-size:30px;box-shadow:0 10px 25px #596af666}dialog{width:min(94%,480px);border:0;border-radius:20px;padding:0;background:var(--card);color:var(--text);box-shadow:0 25px 80px #0005}dialog::backdrop{background:#0f172a88}.modal{padding:18px}.modal h2{margin:0 0 14px}.field{margin-bottom:12px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--day);color:var(--text)}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.buttons{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.buttons button{border:0;border-radius:10px;padding:10px 15px;font-weight:800}.cancel{background:var(--soft);color:var(--text)}.save{background:var(--p)}body[data-t=wood]{--bg:#d8b98b;--card:#fff7e8;--text:#4b2f1c;--muted:#7c5f46;--line:#bc9367;--p:#8b5a2b;--soft:#ead5b8;--day:#fffaf1;--other:#ead8be;background:repeating-linear-gradient(92deg,#00000010 0 2px,transparent 2px 15px),linear-gradient(135deg,#c99c66,#efddb9)}body[data-t=space]{--bg:#070b1f;--card:#111936;--text:#f7f8ff;--muted:#aab3d0;--line:#2d3965;--p:#8b5cf6;--soft:#20294b;--day:#111936;--other:#090f25;background:radial-gradient(circle at 20% 20%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 75% 30%,#9fc4ff 0 1px,transparent 1.5px),radial-gradient(circle at 50% 80%,#fff 0 1px,transparent 1.5px),linear-gradient(#20295f,#070b1f);background-size:100px 100px,140px 140px,170px 170px,auto}body[data-t=space] .chip{background:#ffffff12;color:#fff}body[data-t=space] .today{background:#4c327b}body[data-t=arabian]{--bg:#1c1230;--card:#fff2cf;--text:#3b2340;--muted:#775d77;--line:#d8b454;--p:#8f2d7d;--soft:#f0d4e8;--day:#fff8e5;--other:#ead8b7;background:radial-gradient(circle at top,#6d245f,#1c1230 60%)}body[data-t=arabian] .card,body[data-t=arabian] .bar,body[data-t=arabian] .agenda{box-shadow:0 0 0 3px #d8b45455,0 18px 45px #0005}body[data-t=sea]{--bg:#c9f0ff;--card:#f7fdffdd;--text:#063c55;--muted:#4e7c8e;--line:#8ed3e8;--p:#008ec4;--soft:#dff6ff;--day:#ffffffcc;--other:#d9f2f8;background:radial-gradient(circle at 20% 20%,#ffffffaa 0 5px,transparent 6px),radial-gradient(circle at 80% 40%,#ffffff80 0 8px,transparent 9px),linear-gradient(#8edfff,#dff8ff);background-size:130px 130px,180px 180px,auto}body[data-t=sea] .card,body[data-t=sea] .bar,body[data-t=sea] .agenda{backdrop-filter:blur(10px)}@media(max-width:680px){.head{align-items:flex-start;flex-direction:column}.themes{justify-content:flex-start}.day{min-height:78px}.chip{font-size:8px;padding:3px 2px}.item{grid-template-columns:6px 1fr}.actions{grid-column:2}.row{grid-template-columns:1fr}}.notify-btn{border:0;border-radius:12px;min-height:42px;padding:0 13px;font-weight:800;background:var(--card);color:var(--text);border:1px solid var(--line)}.notify-btn.on{background:var(--primary);color:#fff;border-color:transparent}</style></head><body><main class="app"><header class="head"><h1>予定カレンダー</h1><div class="themes"><button class="theme" data-t="simple">シンプル</button><button class="theme" data-t="wood">木目調</button><button class="theme" data-t="space">宇宙</button><button class="theme" data-t="arabian">アラビアン</button><button class="theme" data-t="sea">海</button></div></header><section class="bar"><button id="prev">‹</button><b id="month"></b><button id="next">›</button></section><section class="card"><div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div><div class="cal" id="cal"></div></section><section class="agenda"><h2 id="ah"></h2><div id="list"></div></section></main><button class="fab" id="add">＋</button><dialog id="dlg"><form class="modal" id="form"><h2 id="dt">予定を追加</h2><input type="hidden" id="id"><div class="field"><label>予定名</label><input id="title" required maxlength="80" placeholder="例：レポート提出"></div><div class="row"><div class="field"><label>日付</label><input id="date" type="date" required></div><div class="field"><label>時間</label><input id="time" type="time"></div></div><div class="field"><label>カテゴリー</label><select id="cat"><option>予定</option><option>大学</option><option>課題</option><option>仕事</option><option>プライベート</option><option>その他</option></select></div><div class="field"><label>色</label><select id="color"><option value="#596af6">青紫</option><option value="#ec4899">ピンク</option><option value="#10b981">緑</option><option value="#f59e0b">橙</option><option value="#ef4444">赤</option></select></div><div class="field"><label>メモ</label><textarea id="memo" rows="3"></textarea></div><div class="buttons"><button type="button" class="cancel" id="cancel">キャンセル</button><button class="save">保存</button></div></form></dialog><script>const K='calendar-events-v2',TK='calendar-theme-v2';let E=JSON.parse(localStorage.getItem(K)||'[]'),V=new Date(),S=f(new Date());V.setDate(1);const q=x=>document.getElementById(x),cal=q('cal'),dlg=q('dlg');function f(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function p(s){let a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function save(){localStorage.setItem(K,JSON.stringify(E))}function render(){q('month').textContent=V.getFullYear()+'年 '+(V.getMonth()+1)+'月';cal.innerHTML='';let y=V.getFullYear(),m=V.getMonth(),a=new Date(y,m,1),st=new Date(y,m,1-a.getDay()),today=f(new Date());for(let i=0;i<42;i++){let d=new Date(st);d.setDate(st.getDate()+i);let k=f(d),es=E.filter(e=>e.date===k).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99')),x=document.createElement('div');x.className='day'+(d.getMonth()!=m?' other':'')+(k===today?' today':'')+(k===S?' sel':'');x.innerHTML='<span class="num">'+d.getDate()+'</span>';es.slice(0,3).forEach(e=>{let b=document.createElement('button');b.className='chip'+(e.done?' done':'');b.style.setProperty('--c',e.color);b.textContent=(e.time?e.time+' ':'')+e.title;b.onclick=z=>{z.stopPropagation();open(e)};x.appendChild(b)});x.onclick=()=>{S=k;if(d.getMonth()!=V.getMonth())V=new Date(d.getFullYear(),d.getMonth(),1);render();open(null,k)};cal.appendChild(x)}agenda()}function agenda(){let d=p(S),es=E.filter(e=>e.date===S).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));q('ah').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日の予定';q('list').innerHTML='';if(!es.length){q('list').innerHTML='<div class="empty">予定はまだないよ</div>';return}es.forEach(e=>{let x=document.createElement('div');x.className='item';x.style.setProperty('--c',e.color);x.innerHTML='<div class="line"></div><div><b'+(e.done?' style="text-decoration:line-through;opacity:.5"':'')+'>'+esc(e.title)+'</b><div class="meta">'+(e.time?esc(e.time)+'・':'')+esc(e.cat||'予定')+(e.memo?'・'+esc(e.memo):'')+'</div></div>';let a=document.createElement('div');a.className='actions';let done=document.createElement('button');done.textContent=e.done?'戻す':'完了';done.onclick=()=>{e.done=!e.done;save();render()};let ed=document.createElement('button');ed.textContent='編集';ed.onclick=()=>open(e);let del=document.createElement('button');del.className='del';del.textContent='削除';del.onclick=()=>{if(confirm('削除する？')){E=E.filter(v=>v.id!==e.id);save();render()}};a.append(done,ed,del);x.appendChild(a);q('list').appendChild(x)})}function open(e=null,d=S){q('dt').textContent=e?'予定を編集':'予定を追加';q('id').value=e?.id||'';q('title').value=e?.title||'';q('date').value=e?.date||d;q('time').value=e?.time||'';q('cat').value=e?.cat||'予定';q('color').value=e?.color||'#596af6';q('memo').value=e?.memo||'';dlg.showModal()}q('form').onsubmit=x=>{x.preventDefault();let id=q('id').value,o={id:id||Date.now().toString(),title:q('title').value.trim(),date:q('date').value,time:q('time').value,cat:q('cat').value,color:q('color').value,memo:q('memo').value.trim(),done:id?(E.find(e=>e.id===id)?.done||false):false};E=id?E.map(e=>e.id===id?o:e):[...E,o];S=o.date;let d=p(S);V=new Date(d.getFullYear(),d.getMonth(),1);save();dlg.close();render()};q('prev').onclick=()=>{V.setMonth(V.getMonth()-1);render()};q('next').onclick=()=>{V.setMonth(V.getMonth()+1);render()};q('add').onclick=()=>open();q('cancel').onclick=()=>dlg.close();function theme(t){document.body.dataset.t=t==='simple'?'':t;document.querySelectorAll('.theme').forEach(b=>b.classList.toggle('on',b.dataset.t===t));localStorage.setItem(TK,t)}document.querySelectorAll('.theme').forEach(b=>b.onclick=()=>theme(b.dataset.t));theme(localStorage.getItem(TK)||'simple');render();</script></body></html>
