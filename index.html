inder"><option value="none">通知なし</option><option value="0">開始時刻</option><option value="10">10分前</option><option value="30">30分前</option><option value="60">1時間前</option><option value="1440">前日</option></select></div><div class="field"><label>カテゴリー</label><select id="cat"><option>予定</option><option>大学</option><option>課題</option><option>仕事</option><option>プライベート</option><option>その他</option></select></div><div class="field"><label>色</label><select id="color"><option value="#596af6">青紫</option><option value="#ec4899">ピンク</option><option value="#10b981">緑</option><option value="#f59e0b">橙</option><option value="#ef4444">赤</option></select></div><div class="field"><label>メモ</label><textarea id="memo" rows="3"></textarea></div><div class="buttons"><button type="button" class="cancel" id="cancel">キャンセル</button><button class="save">保存</button></div></form></dialog><script>const K='calendar-events-v2',TK='calendar-theme-v2',SENT='calendar-sent-reminders-v1';let events=JSON.parse(localStorage.getItem(K)||'[]'),view=new Date(),selected=fmt(new Date());view.setDate(1);const $=id=>document.getElementById(id),cal=$('cal'),dlg=$('dlg');function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function parseDate(s){const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function save(){localStorage.setItem(K,JSON.stringify(events))}function nthWeekday(y,m,w,n){const d=new Date(y,m-1,1),add=(7+w-d.getDay())%7;return 1+add+(n-1)*7}function equinox(y,t){return t==='spring'?Math.floor(20.8431+.242194*(y-1980)-Math.floor((y-1980)/4)):Math.floor(23.2488+.242194*(y-1980)-Math.floor((y-1980)/4))}function baseHoliday(d){const y=d.getFullYear(),m=d.getMonth()+1,n=d.getDate();if(m===1&&n===1)return'元日';if(m===1&&n===nthWeekday(y,1,1,2))return'成人の日';if(m===2&&n===11)return'建国記念の日';if(m===2&&n===23)return'天皇誕生日';if(m===3&&n===equinox(y,'spring'))return'春分の日';if(m===4&&n===29)return'昭和の日';if(m===5&&n===3)return'憲法記念日';if(m===5&&n===4)return'みどりの日';if(m===5&&n===5)return'こどもの日';if(m===7&&n===nthWeekday(y,7,1,3))return'海の日';if(m===8&&n===11)return'山の日';if(m===9&&n===nthWeekday(y,9,1,3))return'敬老の日';if(m===9&&n===equinox(y,'autumn'))return'秋分の日';if(m===10&&n===nthWeekday(y,10,1,2))return'スポーツの日';if(m===11&&n===3)return'文化の日';if(m===11&&n===23)return'勤労感謝の日';return''}function holidayName(d){const n=baseHoliday(d);if(n)return n;if(d.getDay()===1){const p=new Date(d);p.setDate(d.getDate()-1);if(baseHoliday(p))return'振替休日'}return''}const monthData={1:['🎍 お正月','🧑 成人の日','⛄ 冬本番'],2:['👹 節分','🍫 バレンタイン','🎌 建国記念の日'],3:['🎎 ひな祭り','🌸 春分の日','🎓 卒業シーズン'],4:['🌸 お花見','🎒 新学期','🌿 昭和の日'],5:['🎏 こどもの日','🌿 みどりの日','✨ ゴールデンウィーク'],6:['☔ 梅雨シーズン','🐸 雨の日を楽しむ月','🌿 衣替え'],7:['🎋 七夕','🌊 海の日','🎆 花火シーズン'],8:['⛰ 山の日','🏖 夏休み','🎇 夏祭り'],9:['🌕 お月見','👵 敬老の日','🍁 秋の始まり'],10:['🎃 ハロウィン','🏃 スポーツの日','🍂 紅葉シーズン'],11:['🎨 文化の日','🍁 紅葉','💼 勤労感謝の日'],12:['🎄 クリスマス','🎅 クリスマスイブ','🔔 大みそか']};const facts={'1-1':['🎍 元日','新しい一年の始まり。'],'2-3':['👹 節分','豆まきで無病息災を願う日。'],'2-14':['🍫 バレンタインデー','大切な人へ気持ちを伝える日。'],'3-3':['🎎 ひな祭り','子どもの健やかな成長を願う日。'],'4-1':['🌸 新年度','新しい生活が始まりやすい日。'],'5-5':['🎏 こどもの日','子どもの成長と幸せを願う日。'],'7-7':['🎋 七夕','織姫と彦星の伝説で知られる日。'],'8-11':['⛰ 山の日','山に親しみ、恵みに感謝する日。'],'10-31':['🎃 ハロウィン','仮装や飾りを楽しむ日。'],'12-24':['🎅 クリスマスイブ','クリスマス前夜。'],'12-25':['🎄 クリスマス','家族や友人と過ごす人が多い日。'],'12-31':['🔔 大みそか','一年を締めくくる日。']};function updateInfo(){const now=new Date(),key=(now.getMonth()+1)+'-'+now.getDate(),fact=facts[key]||['📅 '+(now.getMonth()+1)+'月'+now.getDate()+'日','今日も予定を確認して、いい一日にしよう。'];$('factTitle').textContent=fact[0];$('factDesc').textContent=fact[1];const m=view.getMonth()+1;$('eventHeading').textContent=m+'月のイベント';$('monthEvents').innerHTML=(monthData[m]||[]).map(x=>'<span class="event-pill">'+x+'</span>').join('')}function render(){const y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),today=fmt(new Date());$('month').textContent=y+'年 '+(m+1)+'月';cal.innerHTML='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const key=fmt(d),h=holidayName(d),es=events.filter(e=>e.date===key).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));const el=document.createElement('div');let cls='day';if(d.getMonth()!==m)cls+=' other';if(d.getDay()===0)cls+=' sunday';if(d.getDay()===6)cls+=' saturday';if(h)cls+=' holiday';if(key===today)cls+=' is-today';if(key===selected)cls+=' selected';el.className=cls;el.innerHTML='<span class="num">'+d.getDate()+'</span>'+(h?'<span class="holiday-name">'+h+'</span>':'');es.slice(0,3).forEach(e=>{const b=document.createElement('button');b.className='chip'+(e.done?' done':'');b.style.setProperty('--c',e.color||'#596af6');b.textContent=(e.time?e.time+' ':'')+e.title;b.onclick=x=>{x.stopPropagation();openDialog(e)};el.appendChild(b)});el.onclick=()=>{selected=key;if(d.getMonth()!==view.getMonth())view=new Date(d.getFullYear(),d.getMonth(),1);render()};cal.appendChild(el)}renderAgenda();updateInfo()}function renderAgenda(){const d=parseDate(selected),es=events.filter(e=>e.date===selected).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));$('agendaTitle').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日の予定';$('list').innerHTML='';if(!es.length){$('list').innerHTML='<div class="empty">予定はまだないよ</div>';return}es.forEach(e=>{const x=document.createElement('div');x.className='item';x.style.setProperty('--c',e.color||'#596af6');x.innerHTML='<div class="line"></div><div><b'+(e.done?' style="text-decoration:line-through;opacity:.5"':'')+'>'+esc(e.title)+'</b><div class="meta">'+(e.time?esc(e.time)+'・':'')+esc(e.cat||'予定')+(e.memo?'・'+esc(e.memo):'')+(e.reminder&&e.reminder!=='none'?'・🔔':'')+'</div></div>';const a=document.createElement('div');a.className='actions';const done=document.createElement('button');done.textContent=e.done?'戻す':'完了';done.onclick=()=>{e.done=!e.done;save();render()};const edit=document. st r=await navigator.serviceWorker.ready;r.showNotification(title,{body,icon:'icon.svg',badge:'icon.svg'})}else new Notification(title,{body})}catch{}}function updateNotify(){if(!('Notification'in window)){$('notify').textContent='通知非対応';return}if(Notification.permission==='granted'){$('notify').textContent='🔔 通知ON';$('notify').classList.add('on')}else $('notify').textContent=Notification.permission==='denied'?'設定で通知を許可':'🔔 通知を許可'}$('notify').onclick=async()=>{if(!('Notification'in window))return;const p=await Notification.requestPermission();updateNotify();if(p==='granted')notify('通知をオンにしたよ','予定が近づいたら知らせるね')};function checkReminders(){if(!('Notification'in window)||Notification.permission!=='granted')return;const now=Date.now(),sent=JSON.parse(localStorage.getItem(SENT)||'{}');let changed=false;events.forEach(e=>{if(!e.time||e.reminder==='none'||e.reminder==null)return;const d=parseDate(e.date),hm=e.time.split(':').map(Number);d.setHours(hm[0],hm[1],0,0);d.setMinutes(d.getMinutes()-Number(e.reminder));const key=[e.id,e.date,e.time,e.reminder].join(':');if(now>=d.getTime()&&now-d.getTime()<90000&&!sent[key]){notify(e.title,e.reminder==='0'?'開始時刻だよ':e.reminder==='1440'?'明日の予定だよ':e.reminder+'分前だよ');sent[key]=now;changed=true}});if(changed)localStorage.setItem(SENT,JSON.stringify(sent))}if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});updateNotify();render();checkReminders();setInterval(checkReminders,20000);</script></body></html>
