<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /><meta name="theme-color" content="#ffffff" /><title>予定カレンダー</title><style>:root{--bg:#f5f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--primary:#5b6cf9;--danger:#ef4444;--shadow:0 14px 38px rgba(31,41,55,.1)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{width:min(100%,1100px);margin:0 auto;padding:14px 12px 90px}.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}.title-wrap{flex:1}.title{margin:0;font-size:clamp(22px,5vw,32px);font-weight:800}.subtitle{margin-top:3px;color:var(--muted);font-size:13px}.toolbar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:var(--shadow);margin-bottom:12px}.toolbar .month{flex:1;text-align:center;font-size:clamp(18px,4.8vw,25px);font-weight:800}.icon-btn,.today-btn,.add-btn{border:0;border-radius:12px;min-height:42px;padding:0 14px;font-weight:700;background:#eef0ff;color:var(--primary)}.icon-btn{width:44px;padding:0;font-size:22px}.today-btn{background:#f3f4f6;color:var(--text)}.add-btn{background:var(--primary);color:#fff}.calendar-card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}.weekdays,.calendar{display:grid;grid-template-columns:repeat(7,1fr)}.weekday{text-align:center;padding:10px 2px;font-size:12px;font-weight:800;color:var(--muted);border-bottom:1px solid var(--line)}.weekday:first-child{color:#ef4444}.weekday:last-child{color:#2563eb}.day{position:relative;min-height:112px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px 5px 5px;background:#fff;overflow:hidden}.day:nth-child(7n){border-right:0}.day.other-month{background:#fafafa;color:#b8bec8}.day.today{background:#fffdf4}.day.selected{outline:2px solid var(--primary);outline-offset:-2px;z-index:1}.day-number{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:999px;font-size:13px;font-weight:800}.day.today .day-number{background:var(--primary);color:#fff}.events{display:flex;flex-direction:column;gap:3px;margin-top:3px}.event-chip{width:100%;border:0;border-left:4px solid var(--event-color);border-radius:6px;padding:4px 5px;text-align:left;background:#f4f5ff;color:#273043;font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.event-chip.done{opacity:.55;text-decoration:line-through}.more{font-size:10px;color:var(--muted);padding-left:4px}.agenda{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}.agenda-title{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px}.agenda-title h2{margin:0;font-size:17px}.agenda-title span{color:var(--muted);font-size:12px}.agenda-empty{padding:18px 5px;color:var(--muted);text-align:center;font-size:14px}.agenda-item{display:grid;grid-template-columns:8px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.agenda-item:first-child{border-top:0}.color-bar{width:8px;height:44px;border-radius:99px;background:var(--event-color)}.agenda-main{min-width:0}.agenda-name{font-weight:800;overflow-wrap:anywhere}.agenda-meta{margin-top:3px;color:var(--muted);font-size:12px}.agenda-actions{display:flex;gap:5px}.small-btn{border:0;border-radius:9px;padding:7px 9px;background:#f3f4f6;color:var(--text);font-size:12px;font-weight:700}.small-btn.danger{color:var(--danger);background:#fff1f2}.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:58px;height:58px;border:0;border-radius:50%;background:var(--pr
